<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>محراب | Mihrab</title>
    <meta name="description" content="محراب - همراه و دستیار آفلاین عبادات و نمازهای قضا" />
    
    <!-- Theme & Status Bar Meta Tags for iOS / Android Web App (PWA) -->
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" id="meta-theme-color-light" />
    <meta name="theme-color" content="#090d16" media="(prefers-color-scheme: dark)" id="meta-theme-color-dark" />
    <meta name="theme-color" content="#090d16" id="meta-theme-color" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" id="meta-apple-status-bar" />
    
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('mihrab_theme_mode');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (saved !== 'light' && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#090d16';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#f8fafc';
          }
          var color = isDark ? '#090d16' : '#f8fafc';
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          metas.forEach(function(m) { m.setAttribute('content', color); });
          var appleStatus = document.getElementById('meta-apple-status-bar');
          if (appleStatus) {
            appleStatus.setAttribute('content', isDark ? 'black-translucent' : 'default');
          }
        } catch(e) {}
      })();
    </script>
    <!-- Favicons -->
    <link rel="icon" type="image/png" href="./favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="محراب" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Persian Vazirmatn Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Google Identity Services (GSI) for Google OAuth & Drive Sync -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-surface-bg text-text-primary font-persian antialiased selection:bg-emerald-500/20 selection:text-emerald-700 dark:selection:text-emerald-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
